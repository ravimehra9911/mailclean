<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <rect width="560" height="300" rx="10" fill="#0a5ea8"/>
  <text x="32" y="58" fill="#fff" font-size="26" font-weight="600">Windows protected your PC</text>
  <text x="32" y="98" fill="#e6f0fa" font-size="14">Microsoft Defender SmartScreen prevented an unrecognized app from</text>
  <text x="32" y="118" fill="#e6f0fa" font-size="14">starting. Running this app might put your PC at risk.</text>
  <text x="32" y="150" fill="#fff" font-size="14" text-decoration="underline">More info</text>
  <rect x="24" y="132" width="86" height="26" rx="6" fill="none" stroke="#ffd34d" stroke-width="3"/>
  <text x="122" y="150" fill="#ffd34d" font-size="14" font-weight="600">← 1. Click “More info”</text>
  <rect x="402" y="236" width="126" height="36" fill="#1a1a1a" fill-opacity=".25" stroke="#fff" stroke-opacity=".7"/>
  <text x="465" y="259" fill="#fff" font-size="14" text-anchor="middle">Don’t run</text>
</svg>
